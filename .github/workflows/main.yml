# This is a basic workflow to help you get started with Actions

name: Win Rates update

# Controls when the workflow will run
on:
  # Manual runs only. The scheduled and push triggers were removed because the
  # job is blocked by a Cloudflare challenge on GitHub-hosted runners.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Run npm install
        run: npm install
        
      - name: Run data updated
        run: node ./lib/download_wr.js

      - name: Push changes to remote
        run: |
          git config --global user.name "Win rates update"
          git config --global user.email "winrates@updater.lol"

          git add -A
          git commit -m "Update win rates"
          git push
